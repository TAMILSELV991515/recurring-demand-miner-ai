<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden - Access Denied</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .forbidden-card {
            max-width: 500px;
            text-align: center;
            padding: 3rem 2rem;
            border-radius: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="glass-card forbidden-card shadow-lg border-danger">
        <div class="kpi-icon icon-rose mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2.2rem;">
            <i class="bi bi-shield-slash-fill"></i>
        </div>
        <h1 class="display-6 fw-bold text-danger mb-2">403 Forbidden</h1>
        <h5 class="fw-semibold text-white mb-3">Access Denied</h5>
        <p class="text-muted small mb-4">
            You do not have administrative privileges to access this page. User accounts are strictly prohibited from viewing administrative portals.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('user_dashboard') }}" class="btn btn-primary px-4 fw-semibold">
                <i class="bi bi-house-door me-1"></i> Return to User Dashboard
            </a>
            <a href="{{ url_for('user_logout') }}" class="btn btn-outline-danger px-4">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </a>
        </div>
    </div>
</body>
</html>
