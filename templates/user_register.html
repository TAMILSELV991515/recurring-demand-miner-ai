<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - IT Support Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Inter', system-ui, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            border-radius: 1.25rem;
            background: #1e293b !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="login-card shadow-lg">
        <div class="text-center mb-4">
            <div class="kpi-icon icon-green mx-auto mb-3" style="width: 65px; height: 65px; font-size: 2rem;">
                <i class="bi bi-person-plus-fill text-success"></i>
            </div>
            <h3 class="fw-bold text-white mb-1">User Registration</h3>
            <div style="color: #94a3b8; font-size: 0.9rem; font-weight: 500;">Create an account for Enterprise Support Portal</div>
        </div>

        {% if error %}
        <div class="alert alert-danger border-danger text-center mb-4 small fw-semibold" style="background: rgba(239, 68, 68, 0.15); color: #fca5a5;">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('user_register') }}" method="POST">
            <div class="mb-3">
                <label class="form-label text-light small fw-bold mb-1">FULL NAME</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-success border-secondary"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control bg-dark text-white border-secondary fs-6 py-2" name="full_name" placeholder="John Doe" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-light small fw-bold mb-1">EMAIL ADDRESS</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-success border-secondary"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" class="form-control bg-dark text-white border-secondary fs-6 py-2" name="email" placeholder="john.doe@company.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-light small fw-bold mb-1">PHONE NUMBER</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-success border-secondary"><i class="bi bi-telephone-fill"></i></span>
                    <input type="text" class="form-control bg-dark text-white border-secondary fs-6 py-2" name="phone" placeholder="+1 (555) 019-2831">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-light small fw-bold mb-1">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-success border-secondary"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control bg-dark text-white border-secondary fs-6 py-2" name="password" placeholder="Create password" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-light small fw-bold mb-1">CONFIRM PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-success border-secondary"><i class="bi bi-shield-lock-fill"></i></span>
                    <input type="password" class="form-control bg-dark text-white border-secondary fs-6 py-2" name="confirm_password" placeholder="Confirm password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm mb-3 py-2">
                <i class="bi bi-check-circle-fill me-2"></i> Register Account
            </button>
        </form>

        <div class="text-center">
            <span style="color: #cbd5e1; font-size: 0.9rem;">Already have an account?</span> 
            <a href="{{ url_for('user_login') }}" class="text-info text-decoration-none fw-bold ms-1" style="font-size: 0.95rem;">Login</a>
        </div>
    </div>
</body>
</html>
