<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - IT Support Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Inter', system-ui, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            border-radius: 1.25rem;
            background: #1e293b !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="login-card shadow-lg">
        <div class="text-center mb-4">
            <div class="kpi-icon icon-blue mx-auto mb-3" style="width: 65px; height: 65px; font-size: 2rem;">
                <i class="bi bi-person-circle text-info"></i>
            </div>
            <h3 class="fw-bold text-white mb-1">User Login</h3>
            <div style="color: #94a3b8; font-size: 0.9rem; font-weight: 500;">Enterprise IT Support Portal</div>
        </div>

        {% if registered %}
        <div class="alert alert-success border-success text-center mb-4 small fw-semibold" style="background: rgba(34, 197, 94, 0.15); color: #4ade80;">
            <i class="bi bi-check-circle-fill me-1"></i> Registration successful! Please log in below.
        </div>
        {% endif %}

        {% if error %}
        <div class="alert alert-danger border-danger text-center mb-4 small fw-semibold" style="background: rgba(239, 68, 68, 0.15); color: #fca5a5;">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('user_login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label text-light small fw-bold mb-1">EMAIL ADDRESS</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-info border-secondary"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" class="form-control bg-dark text-white border-secondary fs-6 py-2" name="email" placeholder="e.g. user@company.com" required autocomplete="username">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-light small fw-bold mb-1">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-info border-secondary"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control bg-dark text-white border-secondary fs-6 py-2" name="password" placeholder="Enter password" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3 py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i> Login
            </button>
        </form>

        <div class="text-center mb-4">
            <span style="color: #cbd5e1; font-size: 0.9rem;">Don't have an account?</span> 
            <a href="{{ url_for('user_register') }}" class="text-info text-decoration-none fw-bold ms-1" style="font-size: 0.95rem;">Register</a>
        </div>

        <div class="p-3 rounded text-center small" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8;">
            <i class="bi bi-info-circle-fill text-info me-1"></i> <strong class="text-light">Default Test User:</strong><br>
            <span class="text-light">Email:</span> <code class="text-info fw-bold">user@company.com</code> | <span class="text-light">Password:</span> <code class="text-info fw-bold">user123</code>
        </div>
    </div>
</body>
</html>
