<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}User Dashboard{% endblock %} - IT Support Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .user-navbar {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0.85rem 2rem;
        }
        .user-main-content {
            margin-left: 0 !important;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <!-- User Navbar -->
    <nav class="navbar navbar-expand-lg user-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-white fs-4 d-flex align-items-center gap-2" href="{{ url_for('user_dashboard') }}">
                <i class="bi bi-headset text-primary fs-3"></i>
                <span>IT Support Portal</span>
            </a>
            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#userNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="userNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-1">
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'user_dashboard' %}active{% endif %}" href="{{ url_for('user_dashboard') }}">
                            <i class="bi bi-grid-1x2-fill me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'book_ticket' %}active{% endif %}" href="{{ url_for('user_book_ticket') }}">
                            <i class="bi bi-plus-circle-fill me-1"></i> Book Ticket
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'my_tickets' %}active{% endif %}" href="{{ url_for('user_my_tickets') }}">
                            <i class="bi bi-ticket-detailed-fill me-1"></i> My Tickets
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'track' %}active{% endif %}" href="{{ url_for('user_track') }}">
                            <i class="bi bi-geo-alt-fill me-1"></i> Track Ticket
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'ai_suggestions' %}active{% endif %}" href="{{ url_for('user_ai_suggestions') }}">
                            <i class="bi bi-lightbulb-fill me-1"></i> AI Suggestions
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'profile' %}active{% endif %}" href="{{ url_for('user_profile') }}">
                            <i class="bi bi-person-fill me-1"></i> My Profile
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center ms-lg-3 gap-2">
                    <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme">
                        <i class="bi bi-sun-fill" id="themeIcon"></i>
                    </button>
                    <a href="{{ url_for('user_logout') }}" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- User Content Container -->
    <div class="user-main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
